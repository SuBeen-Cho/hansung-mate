services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hansung_ieum
      POSTGRES_USER: hansung
      POSTGRES_PASSWORD: hansung
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hansung -d hansung_ieum"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - hansung-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hansung
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hansung-minio:/data

volumes:
  hansung-postgres:
  hansung-minio:
